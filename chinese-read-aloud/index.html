<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3158d7"><title>Marco 中文 · 逐字听写</title><meta name="description" content="点喇叭听一个字，在纸上写；不会写时再显示大字。"><link rel="stylesheet" href="./style.css?v=2"><script src="./app.js?v=2" defer></script></head>
<body><main>
  <a class="back" href="../">← 主学习中心</a>
  <header><h1>Marco 中文</h1><p>点 🔊 听一个字 → 在纸上写 → 不会写，再点“显示字”</p></header>
  <div class="toolbar"><nav aria-label="练习内容"><a href="#row1">第一行词语</a><a href="#row2">第二行词语</a><a href="#sentences">课文句子</a></nav><div class="settings"><label>语速 <select id="speed"><option value="0.7">慢读</option><option value="0.9">正常</option></select></label><button id="hide-all">全部藏起来</button><button id="stop" disabled>停止朗读</button></div></div>
  <p id="status" role="status" aria-live="polite">每个喇叭对应一个字。字先藏着，写不出时再看。</p>
  <section id="row1"><h2>第一行词语 <span>11 个</span></h2><div id="words1" class="groups"></div></section>
  <section id="row2"><h2>第二行词语 <span>10 个</span></h2><div id="words2" class="groups"></div></section>
  <section id="sentences"><div class="section-title"><h2>课文句子 <span>分 5 小段</span></h2><button id="paragraph">🔊 听完整句子</button></div><div id="phrases" class="phrases"></div></section>
  <footer>在纸上写。点“显示字”对照，记住后再藏起来写一次。</footer>
  <noscript>请开启浏览器 JavaScript 后使用逐字听写。</noscript>
</main></body></html>
