*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#eef3f9;color:#14213d;overscroll-behavior:none}header{position:sticky;top:0;z-index:50;background:#fff;padding:12px 16px;box-shadow:0 2px 10px #b9c4d355;text-align:center}h1{font-size:23px;margin:0}.hint{font-size:13px;color:#667085;margin:4px}.controls button{border:0;border-radius:10px;padding:8px 15px;background:#315dd7;color:#fff;font-weight:700}.scroll{overflow:auto;-webkit-overflow-scrolling:touch}.bracket{display:flex;gap:14px;padding:12px;min-width:1080px;min-height:760px}.round{width:160px;display:flex;flex-direction:column}.round h2{text-align:center;font-size:15px;position:sticky;top:94px;background:#eef3f9;padding:7px;z-index:5}.games{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:8px}.match{background:#fff;border-radius:13px;padding:7px;box-shadow:0 2px 8px #aab7c633;transition:.12s}.team{height:40px;margin:5px 0;padding:0 8px;border:2px solid #d9e1ec;border-radius:10px;display:flex;align-items:center;font-size:13px;font-weight:700;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}.team.empty{color:#a1aab8;font-weight:500}.team.winner{background:#e2f7e8;border-color:#51ae6b}.team.dragging{opacity:.75;transform:scale(1.07);box-shadow:0 8px 25px #53678466;z-index:99}.match.drop-ready{outline:4px solid #3974ef;outline-offset:4px;background:#eaf2ff;transform:scale(1.04)}.champion{margin:auto;background:#fff7d6;border:2px solid #e6b800;border-radius:16px;padding:25px 12px;text-align:center;font-size:20px;font-weight:800}.arrow{color:#8090a8;text-align:center;font-size:12px}@media(max-width:700px){.bracket{gap:18px;padding:12px}.round{width:205px}.team{height:58px;font-size:17px}.round h2{top:91px}}

<style>

</style></head><body><header><h1>🏆 World Cup 2026</h1><div class="hint">Hold a team and drag it toward the next round — release anywhere over that matchup.</div><div class="controls"><button onclick="resetBracket()">Reset</button></div></header><button id="countryToggle" class="picker-toggle" onclick="toggleCountries()">🌍 Show all countries</button><div id="picker" class="picker" style="display:none"><div class="picker-title">Choose a country, then tap a Round-of-32 slot</div><div id="countryPool" class="country-pool" style="flex-wrap:wrap;overflow:visible"></div></div><div class="scroll"><div id="bracket" class="bracket"></div></div><script>
function toggleCountries(){let p=document.getElementById('picker'),b=document.getElementById('countryToggle'),open=p.style.display!=='none';p.style.display=open?'none':'block';b.textContent=open?'🌍 Show all countries':'✕ Hide countries'}
const countryList=[["Argentina","ar"],["Australia","au"],["Austria","at"],["Belgium","be"],["Bosnia & Herzegovina","ba"],["Brazil","br"],["Cabo Verde","cv"],["Canada","ca"],["Colombia","co"],["Congo DR","cd"],["Côte d’Ivoire","ci"],["Croatia","hr"],["Curaçao","cw"],["Czechia","cz"],["Ecuador","ec"],["Egypt","eg"],["England","gb-eng"],["France","fr"],["Germany","de"],["Ghana","gh"],["Haiti","ht"],["Iran","ir"],["Iraq","iq"],["Japan","jp"],["Jordan","jo"],["Mexico","mx"],["Morocco","ma"],["Netherlands","nl"],["New Zealand","nz"],["Norway","no"],["Panama","pa"],["Paraguay","py"],["Portugal","pt"],["Qatar","qa"],["Saudi Arabia","sa"],["Scotland","gb-sct"],["Senegal","sn"],["South Africa","za"],["South Korea","kr"],["Spain","es"],["Sweden","se"],["Switzerland","ch"],["Tunisia","tn"],["Türkiye","tr"],["United States","us"],["Uruguay","uy"],["Uzbekistan","uz"],["Algeria","dz"]];let selectedCountry=null;const flagUrl=c=>'https://flagcdn.com/w80/'+c+'.png';function renderPool(){let p=document.getElementById('countryPool');p.innerHTML='';countryList.forEach(([n,c])=>{let d=document.createElement('div');d.className='country-card'+(selectedCountry&&selectedCountry[0]===n?' selected':'');d.innerHTML='<img src="'+flagUrl(c)+'" alt="'+n+' flag"><span>'+n+'</span>';d.onclick=()=>{selectedCountry=[n,c];renderPool();document.querySelectorAll('.match[data-round="0"]').forEach(x=>x.classList.add('slot-pick'))};p.appendChild(d)})}function codeFor(n){let x=countryList.find(a=>a[0]===n);return x?x[1]:null}
const sizes=[16,8,4,2,1],names=['Round of 32','Round of 16','Quarterfinals','Semifinals','Final'],key='wc26-custom';
let state=JSON.parse(localStorage.getItem(key)||'null')||{r:Array.from({length:5},(_,k)=>Array(sizes[k]*2).fill('')),w:Array.from({length:5},(_,k)=>Array(sizes[k]).fill(null))};
if(!state.r[0].some(Boolean))state.r[0]=['Argentina','Australia','Belgium','Brazil','Canada','Colombia','Croatia','Denmark','Ecuador','Egypt','England','France','Germany','Ghana','Iran','Italy','Japan','Mexico','Morocco','Netherlands','Nigeria','Norway','Portugal','Saudi Arabia','Senegal','South Korea','Spain','Switzerland','Tunisia','United States','Uruguay','New Zealand'];
const flags={'Argentina':'🇦🇷','Australia':'🇦🇺','Belgium':'🇧🇪','Brazil':'🇧🇷','Canada':'🇨🇦','Colombia':'🇨🇴','Croatia':'🇭🇷','Denmark':'🇩🇰','Ecuador':'🇪🇨','Egypt':'🇪🇬','England':'🏴','France':'🇫🇷','Germany':'🇩🇪','Ghana':'🇬🇭','Iran':'🇮🇷','Italy':'🇮🇹','Japan':'🇯🇵','Mexico':'🇲🇽','Morocco':'🇲🇦','Netherlands':'🇳🇱','Nigeria':'🇳🇬','Norway':'🇳🇴','Portugal':'🇵🇹','Saudi Arabia':'🇸🇦','Senegal':'🇸🇳','South Korea':'🇰🇷','Spain':'🇪🇸','Switzerland':'🇨🇭','Tunisia':'🇹🇳','United States':'🇺🇸','Uruguay':'🇺🇾','New Zealand':'🇳🇿'};function label(v){return v?'<span class="flag">'+(flags[v]||'🌐')+'</span><span>'+v+'</span>':'Waiting'}
function save(){localStorage.setItem(key,JSON.stringify(state))}
function rebuild(){for(let k=1;k<5;k++){state.r[k]=Array(sizes[k]*2).fill('');for(let m=0;m<sizes[k-1];m++){let s=state.w[k-1][m];if(s!==null)state.r[k][m]=state.r[k-1][2*m+s]}}save();render()}
function choose(k,m,s){if(k>4)return;state.w[k][m]=s;for(let j=k+1;j<5;j++)state.w[j].fill(null);rebuild()}
function targetAt(x,y,nextRound){let els=[...document.querySelectorAll('.match[data-round="'+nextRound+'"]')];return els.find(el=>{let r=el.getBoundingClientRect();return x>=r.left-80&&x<=r.right+80&&y>=r.top-70&&y<=r.bottom+70})}
function clearDrop(){document.querySelectorAll('.drop-ready').forEach(x=>x.classList.remove('drop-ready'))}
function render(){let b=document.getElementById('bracket');b.innerHTML='';for(let k=0;k<5;k++){let col=document.createElement('section');col.className='round';col.innerHTML='<h2>'+names[k]+'</h2>';let games=document.createElement('div');games.className='games';for(let m=0;m<sizes[k];m++){let box=document.createElement('div');box.className='match';box.dataset.round=k;box.dataset.match=m;box.ondragover=e=>{e.preventDefault();box.classList.add('drop-ready')};box.ondragleave=()=>box.classList.remove('drop-ready');box.ondrop=e=>{e.preventDefault();clearDrop();try{let x=JSON.parse(e.dataTransfer.getData('text/plain'));if(k===x.k+1){box.classList.add('placed');if(navigator.vibrate)navigator.vibrate(25);setTimeout(()=>box.classList.remove('placed'),650);choose(x.k,x.m,x.s)}}catch(_){}};for(let s=0;s<2;s++){let idx=2*m+s,d=document.createElement('div'),val=state.r[k][idx];d.className='team'+(val?'':' empty')+(state.w[k][m]===s?' winner':'');let fc=codeFor(val);d.innerHTML=(fc?'<img src="'+flagUrl(fc)+'" style="width:28px;height:18px;object-fit:cover;border-radius:2px;margin-right:6px">':'')+'<span>'+val+'</span>';if(k===0)d.onclick=()=>{if(selectedCountry){state.r[0][idx]=selectedCountry[0];selectedCountry=null;for(let j=0;j<5;j++)state.w[j].fill(null);document.querySelectorAll('.slot-pick').forEach(x=>x.classList.remove('slot-pick'));save();renderPool();rebuild()}};d.draggable=!!val;d.ondragstart=e=>{if(!val)return e.preventDefault();e.dataTransfer.setData('text/plain',JSON.stringify({k,m,s}));d.classList.add('dragging')};d.ondragend=()=>{d.classList.remove('dragging');clearDrop()};d.ontouchstart=e=>{if(!val)return;window.dragTouch={k,m,s,el:d};d.classList.add('dragging')};d.ontouchmove=e=>{if(!window.dragTouch)return;e.preventDefault();let t=e.touches[0];clearDrop();let target=targetAt(t.clientX,t.clientY,k+1);if(target)target.classList.add('drop-ready')};d.ontouchend=e=>{if(!window.dragTouch)return;let t=e.changedTouches[0],target=targetAt(t.clientX,t.clientY,k+1);d.classList.remove('dragging');clearDrop();if(target){target.classList.add('placed');if(navigator.vibrate)navigator.vibrate(25);setTimeout(()=>target.classList.remove('placed'),650);choose(k,m,s)}window.dragTouch=null};box.appendChild(d)}games.appendChild(box)}col.appendChild(games);b.appendChild(col)}let c=document.createElement('section');c.className='round';let champ=state.w[4][0]===null?'Drag final winner here':state.r[4][state.w[4][0]];c.innerHTML='<h2>Champion</h2><div class="games"><div class="champion">🏆<br>'+label(champ)+'</div></div>';b.appendChild(c)}
renderPool();function resetBracket(){if(confirm('Reset the bracket?')){localStorage.removeItem(key);location.reload()}}render();
</script></body></html>
