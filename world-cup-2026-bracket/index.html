<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Cup 2026 Custom Bracket</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#152238}header{padding:18px;text-align:center;background:#fff;position:sticky;top:0;z-index:2;box-shadow:0 1px 6px #ccd}h1{margin:0;font-size:24px}.sub{font-size:13px;color:#667}.bracket{display:flex;gap:20px;padding:22px;min-width:1250px;align-items:stretch}.round{width:220px;display:flex;flex-direction:column;justify-content:space-around}.round h2{text-align:center;font-size:16px}.match{background:white;border-radius:10px;padding:7px;box-shadow:0 1px 5px #ccd;margin:5px 0}.team{padding:14px 12px;border-radius:10px;cursor:pointer;border:2px solid #d9e0ea;margin:6px 0;min-height:28px;font-size:17px;font-weight:600;display:flex;align-items:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}.team:active{transform:scale(.97);background:#dce9ff}.match{touch-action:manipulation}@media(max-width:800px){.bracket{gap:14px;padding:12px;min-width:1320px}.round{width:240px}.team{min-height:34px;padding:16px 14px;font-size:18px}}.team:hover{background:#eaf2ff}.winner{background:#dff5e6;border-color:#67bd7d;font-weight:700}.champ{font-size:20px;text-align:center;background:#fff4c9}.controls{text-align:center;padding:10px}button{padding:9px 16px;border:0;border-radius:8px;background:#2457d6;color:white;font-weight:600}input{width:100%;box-sizing:border-box;border:0;background:transparent;font:inherit;outline:none}</style><style>
.team{cursor:grab}.team.dragging{opacity:.45;transform:scale(.96)}.match.drop-ready{outline:3px dashed #4f7ee8;outline-offset:3px}.drag-tip{font-size:14px;font-weight:700;color:#2457d6;margin-top:6px}
</style><style>
/* Easier finger dragging */
.team{min-height:52px;padding:16px 14px;cursor:grab;touch-action:none}
.team.dragging{opacity:.72;transform:scale(1.06);box-shadow:0 8px 22px #9aa8c7;position:relative;z-index:20}
.match.drop-ready{outline:4px solid #4f7ee8;background:#eaf2ff;transform:scale(1.03)}
@media(max-width:800px){.team{min-height:58px;padding:18px 15px}.match{padding:10px}}
</style></head><body><header><h1>🏆 World Cup 2026 — My Bracket</h1><div class="sub">Edit the Round-of-32 teams, then drag a team onto the next-round matchup to advance it.</div><div class="drag-tip">↗ Drag your winner to the next round</div><div class="controls"><button onclick="resetBracket()">Reset bracket</button></div></header><div id="bracket" class="bracket"></div><script>
const sizes=[16,8,4,2,1], names=['Round of 32','Round of 16','Quarterfinals','Semifinals','Final'];
let state=JSON.parse(localStorage.getItem('wc26-custom')||'null')||{r:Array.from({length:5},(_,k)=>Array(sizes[k]*2).fill('')),w:Array.from({length:5},(_,k)=>Array(sizes[k]).fill(null))};
if(!state.r[0].some(Boolean)) state.r[0]=Array.from({length:32},(_,i)=>'Team '+(i+1));
function save(){localStorage.setItem('wc26-custom',JSON.stringify(state))}
function rebuild(){for(let k=1;k<5;k++){state.r[k]=Array(sizes[k]*2).fill('');for(let i=0;i<sizes[k-1];i++){let win=state.w[k-1][i];if(win!==null)state.r[k][i]=state.r[k-1][2*i+win]}}save();render()}
function choose(k,m,s){state.w[k][m]=s;for(let j=k+1;j<5;j++)state.w[j].fill(null);rebuild()}
function edit(i,v){state.r[0][i]=v;for(let j=0;j<5;j++)state.w[j].fill(null);rebuild()}
function render(){let b=document.getElementById('bracket');b.innerHTML='';for(let k=0;k<5;k++){let col=document.createElement('div');col.className='round';col.innerHTML='<h2>'+names[k]+'</h2>';for(let m=0;m<sizes[k];m++){let box=document.createElement('div');box.className='match';box.dataset.round=k;box.dataset.match=m;box.ondragover=e=>{e.preventDefault();box.classList.add('drop-ready')};box.ondragleave=()=>box.classList.remove('drop-ready');box.ondrop=e=>{e.preventDefault();box.classList.remove('drop-ready');try{let x=JSON.parse(e.dataTransfer.getData('text/plain'));if(k===x.k+1)choose(x.k,x.m,x.s)}catch(_){}};for(let s=0;s<2;s++){let idx=2*m+s,d=document.createElement('div');d.className='team'+(state.w[k][m]===s?' winner':'');if(k===0){let inp=document.createElement('input');inp.value=state.r[k][idx];inp.onchange=e=>edit(idx,e.target.value);inp.onclick=e=>e.stopPropagation();inp.ontouchstart=e=>e.stopPropagation();d.appendChild(inp)}else d.textContent=state.r[k][idx]||'—';d.draggable=!!state.r[k][idx];d.ondragstart=e=>{if(!state.r[k][idx])return e.preventDefault();e.dataTransfer.setData('text/plain',JSON.stringify({k,m,s}));d.classList.add('dragging')};d.ondragend=()=>d.classList.remove('dragging');d.ontouchstart=e=>{if(!state.r[k][idx]||e.target.tagName==='INPUT')return;let t=e.touches[0];window.dragTouch={k,m,s,el:d};d.classList.add('dragging')};d.ontouchmove=e=>{if(!window.dragTouch)return;e.preventDefault();let t=e.touches[0],el=document.elementFromPoint(t.clientX,t.clientY);document.querySelectorAll('.drop-ready').forEach(x=>x.classList.remove('drop-ready'));let mb=el&&el.closest('.match');if(!mb&&el){let candidates=[...document.querySelectorAll('.match')];mb=candidates.find(x=>{let r=x.getBoundingClientRect();return t.clientX>=r.left-45&&t.clientX<=r.right+45&&t.clientY>=r.top-45&&t.clientY<=r.bottom+45})}if(mb)mb.classList.add('drop-ready')};d.ontouchend=e=>{if(!window.dragTouch)return;let t=e.changedTouches[0],el=document.elementFromPoint(t.clientX,t.clientY),target=el&&el.closest('.match');if(!target){target=[...document.querySelectorAll('.match')].find(x=>{let r=x.getBoundingClientRect();return t.clientX>=r.left-55&&t.clientX<=r.right+55&&t.clientY>=r.top-55&&t.clientY<=r.bottom+55})}d.classList.remove('dragging');document.querySelectorAll('.drop-ready').forEach(x=>x.classList.remove('drop-ready'));if(target&&target.dataset.round==k+1)choose(k,m,s);window.dragTouch=null};box.appendChild(d)}col.appendChild(box)}b.appendChild(col)}let c=document.createElement('div');c.className='round';let champ='—';if(state.w[4][0]!=null)champ=state.r[4][state.w[4][0]];c.innerHTML='<h2>Champion</h2><div class="match champ">🏆 '+champ+'</div>';b.appendChild(c)}
function resetBracket(){if(confirm('Reset the entire bracket?')){localStorage.removeItem('wc26-custom');location.reload()}}render();
</script></body></html>
