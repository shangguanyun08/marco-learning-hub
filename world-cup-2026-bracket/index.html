<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>World Cup 2026 Bracket</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#eef3f9;color:#14213d;overscroll-behavior:none}header{position:sticky;top:0;z-index:50;background:#fff;padding:12px 16px;box-shadow:0 2px 10px #b9c4d355;text-align:center}h1{font-size:23px;margin:0}.hint{font-size:13px;color:#667085;margin:4px}.controls button{border:0;border-radius:10px;padding:8px 15px;background:#315dd7;color:#fff;font-weight:700}.scroll{overflow:auto;-webkit-overflow-scrolling:touch}.bracket{display:flex;gap:28px;padding:18px;min-width:1480px;min-height:1000px}.round{width:220px;display:flex;flex-direction:column}.round h2{text-align:center;font-size:15px;position:sticky;top:94px;background:#eef3f9;padding:7px;z-index:5}.games{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:8px}.match{background:#fff;border-radius:13px;padding:7px;box-shadow:0 2px 8px #aab7c633;transition:.12s}.team{height:54px;margin:5px 0;padding:0 13px;border:2px solid #d9e1ec;border-radius:10px;display:flex;align-items:center;font-size:16px;font-weight:700;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}.team.empty{color:#a1aab8;font-weight:500}.team.winner{background:#e2f7e8;border-color:#51ae6b}.team.dragging{opacity:.75;transform:scale(1.07);box-shadow:0 8px 25px #53678466;z-index:99}.match.drop-ready{outline:4px solid #3974ef;outline-offset:4px;background:#eaf2ff;transform:scale(1.04)}.champion{margin:auto;background:#fff7d6;border:2px solid #e6b800;border-radius:16px;padding:25px 12px;text-align:center;font-size:20px;font-weight:800}.arrow{color:#8090a8;text-align:center;font-size:12px}@media(max-width:700px){.bracket{gap:18px;padding:12px}.round{width:205px}.team{height:58px;font-size:17px}.round h2{top:91px}}
</style></head><body><header><h1>🏆 World Cup 2026</h1><div class="hint">Hold a team and drag it toward the next round — release anywhere over that matchup.</div><div class="controls"><button onclick="resetBracket()">Reset</button></div></header><div class="scroll"><div id="bracket" class="bracket"></div></div><script>
const sizes=[16,8,4,2,1],names=['Round of 32','Round of 16','Quarterfinals','Semifinals','Final'],key='wc26-custom';
let state=JSON.parse(localStorage.getItem(key)||'null')||{r:Array.from({length:5},(_,k)=>Array(sizes[k]*2).fill('')),w:Array.from({length:5},(_,k)=>Array(sizes[k]).fill(null))};
if(!state.r[0].some(Boolean))state.r[0]=Array.from({length:32},(_,i)=>'Team '+(i+1));
function save(){localStorage.setItem(key,JSON.stringify(state))}
function rebuild(){for(let k=1;k<5;k++){state.r[k]=Array(sizes[k]*2).fill('');for(let m=0;m<sizes[k-1];m++){let s=state.w[k-1][m];if(s!==null)state.r[k][m]=state.r[k-1][2*m+s]}}save();render()}
function choose(k,m,s){if(k>4)return;state.w[k][m]=s;for(let j=k+1;j<5;j++)state.w[j].fill(null);rebuild()}
function targetAt(x,y,nextRound){let els=[...document.querySelectorAll('.match[data-round="'+nextRound+'"]')];return els.find(el=>{let r=el.getBoundingClientRect();return x>=r.left-80&&x<=r.right+80&&y>=r.top-70&&y<=r.bottom+70})}
function clearDrop(){document.querySelectorAll('.drop-ready').forEach(x=>x.classList.remove('drop-ready'))}
function render(){let b=document.getElementById('bracket');b.innerHTML='';for(let k=0;k<5;k++){let col=document.createElement('section');col.className='round';col.innerHTML='<h2>'+names[k]+'</h2>';let games=document.createElement('div');games.className='games';for(let m=0;m<sizes[k];m++){let box=document.createElement('div');box.className='match';box.dataset.round=k;box.dataset.match=m;box.ondragover=e=>{e.preventDefault();box.classList.add('drop-ready')};box.ondragleave=()=>box.classList.remove('drop-ready');box.ondrop=e=>{e.preventDefault();clearDrop();try{let x=JSON.parse(e.dataTransfer.getData('text/plain'));if(k===x.k+1)choose(x.k,x.m,x.s)}catch(_){}};for(let s=0;s<2;s++){let idx=2*m+s,d=document.createElement('div'),val=state.r[k][idx];d.className='team'+(val?'':' empty')+(state.w[k][m]===s?' winner':'');d.textContent=val||'Waiting for winner';d.draggable=!!val;d.ondragstart=e=>{if(!val)return e.preventDefault();e.dataTransfer.setData('text/plain',JSON.stringify({k,m,s}));d.classList.add('dragging')};d.ondragend=()=>{d.classList.remove('dragging');clearDrop()};d.ontouchstart=e=>{if(!val)return;window.dragTouch={k,m,s,el:d};d.classList.add('dragging')};d.ontouchmove=e=>{if(!window.dragTouch)return;e.preventDefault();let t=e.touches[0];clearDrop();let target=targetAt(t.clientX,t.clientY,k+1);if(target)target.classList.add('drop-ready')};d.ontouchend=e=>{if(!window.dragTouch)return;let t=e.changedTouches[0],target=targetAt(t.clientX,t.clientY,k+1);d.classList.remove('dragging');clearDrop();if(target)choose(k,m,s);window.dragTouch=null};box.appendChild(d)}games.appendChild(box)}col.appendChild(games);b.appendChild(col)}let c=document.createElement('section');c.className='round';let champ=state.w[4][0]===null?'Drag final winner here':state.r[4][state.w[4][0]];c.innerHTML='<h2>Champion</h2><div class="games"><div class="champion">🏆<br>'+champ+'</div></div>';b.appendChild(c)}
function resetBracket(){if(confirm('Reset the bracket?')){localStorage.removeItem(key);location.reload()}}render();
</script></body></html>
