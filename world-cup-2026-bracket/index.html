<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Cup 2026 Custom Bracket</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#152238}header{padding:18px;text-align:center;background:#fff;position:sticky;top:0;z-index:2;box-shadow:0 1px 6px #ccd}h1{margin:0;font-size:24px}.sub{font-size:13px;color:#667}.bracket{display:flex;gap:20px;padding:22px;min-width:1250px;align-items:stretch}.round{width:220px;display:flex;flex-direction:column;justify-content:space-around}.round h2{text-align:center;font-size:16px}.match{background:white;border-radius:10px;padding:7px;box-shadow:0 1px 5px #ccd;margin:5px 0}.team{padding:8px;border-radius:7px;cursor:pointer;border:1px solid #e1e6ee;margin:3px 0;min-height:20px}.team:hover{background:#eaf2ff}.winner{background:#dff5e6;border-color:#67bd7d;font-weight:700}.champ{font-size:20px;text-align:center;background:#fff4c9}.controls{text-align:center;padding:10px}button{padding:9px 16px;border:0;border-radius:8px;background:#2457d6;color:white;font-weight:600}input{width:100%;box-sizing:border-box;border:0;background:transparent;font:inherit;outline:none}</style></head><body><header><h1>🏆 World Cup 2026 — My Bracket</h1><div class="sub">Edit any Round-of-32 team name, then tap a team to advance it. Your bracket saves automatically on this device.</div><div class="controls"><button onclick="resetBracket()">Reset bracket</button></div></header><div id="bracket" class="bracket"></div><script>
const sizes=[16,8,4,2,1], names=['Round of 32','Round of 16','Quarterfinals','Semifinals','Final'];
let state=JSON.parse(localStorage.getItem('wc26-custom')||'null')||{r:Array.from({length:5},(_,k)=>Array(sizes[k]*2).fill('')),w:Array.from({length:5},(_,k)=>Array(sizes[k]).fill(null))};
if(!state.r[0].some(Boolean)) state.r[0]=Array.from({length:32},(_,i)=>'Team '+(i+1));
function save(){localStorage.setItem('wc26-custom',JSON.stringify(state))}
function rebuild(){for(let k=1;k<5;k++){state.r[k]=Array(sizes[k]*2).fill('');for(let i=0;i<sizes[k-1];i++){let win=state.w[k-1][i];if(win!==null)state.r[k][i]=state.r[k-1][2*i+win]}}save();render()}
function choose(k,m,s){state.w[k][m]=s;for(let j=k+1;j<5;j++)state.w[j].fill(null);rebuild()}
function edit(i,v){state.r[0][i]=v;for(let j=0;j<5;j++)state.w[j].fill(null);rebuild()}
function render(){let b=document.getElementById('bracket');b.innerHTML='';for(let k=0;k<5;k++){let col=document.createElement('div');col.className='round';col.innerHTML='<h2>'+names[k]+'</h2>';for(let m=0;m<sizes[k];m++){let box=document.createElement('div');box.className='match';for(let s=0;s<2;s++){let idx=2*m+s,d=document.createElement('div');d.className='team'+(state.w[k][m]===s?' winner':'');if(k===0){let inp=document.createElement('input');inp.value=state.r[k][idx];inp.onchange=e=>edit(idx,e.target.value);inp.onclick=e=>e.stopPropagation();d.appendChild(inp)}else d.textContent=state.r[k][idx]||'—';d.onclick=()=>{if(state.r[k][idx])choose(k,m,s)};box.appendChild(d)}col.appendChild(box)}b.appendChild(col)}let c=document.createElement('div');c.className='round';let champ='—';if(state.w[4][0]!=null)champ=state.r[4][state.w[4][0]];c.innerHTML='<h2>Champion</h2><div class="match champ">🏆 '+champ+'</div>';b.appendChild(c)}
function resetBracket(){if(confirm('Reset the entire bracket?')){localStorage.removeItem('wc26-custom');location.reload()}}render();
</script></body></html>
